services:
  backend:
    build: .
    command: sh -c "python scripts/seed_demo_data.py && python scripts/run_backend.py"
    environment:
      ARE_BACKEND_HOST: 0.0.0.0
      ARE_BACKEND_PORT: 8000
      ARE_LLM_PROVIDER: deterministic
    ports:
      - "8000:8000"
    volumes:
      - are-data:/app/data

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  are-data:
