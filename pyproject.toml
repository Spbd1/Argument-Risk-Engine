[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "argument-risk-engine"
version = "0.1.0"
description = "Local, taxonomy-grounded argument risk analysis dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Argument-Risk-Engine contributors"}]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["engine", "."]
include = ["argument_risk_engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "engine"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
